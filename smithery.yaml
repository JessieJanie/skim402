# Smithery configuration for skim-mcp
# https://smithery.ai/docs
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      SKIM_API_KEY:
        type: string
        title: Skim API key
        description: >-
          Recommended. Card-plan API key (sk402_...). Free tier at
          skim402.com/pricing. Takes priority over a wallet key.
      SKIM_WALLET_PRIVATE_KEY:
        type: string
        title: Base wallet private key (optional)
        description: >-
          Optional. 0x-prefixed 64-hex-char private key for a DEDICATED Base
          wallet funded with a small amount of USDC. Used only when SKIM_API_KEY
          is not set. Never use a personal wallet — the key is stored by your
          MCP client in plaintext.
      SKIM_MAX_PRICE_USD:
        type: string
        title: Max price per call (USD)
        description: >-
          Optional hard cap on per-call price in USD (wallet lane only).
          Default 0.01. Raise (e.g. 0.05) for batch, extract, or watch.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'skim-mcp'],
      env: Object.assign(
        {},
        config.SKIM_API_KEY ? { SKIM_API_KEY: config.SKIM_API_KEY } : {},
        config.SKIM_WALLET_PRIVATE_KEY ? { SKIM_WALLET_PRIVATE_KEY: config.SKIM_WALLET_PRIVATE_KEY } : {},
        config.SKIM_MAX_PRICE_USD ? { SKIM_MAX_PRICE_USD: config.SKIM_MAX_PRICE_USD } : {}
      )
    })
